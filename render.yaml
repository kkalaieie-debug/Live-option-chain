services:
  - type: web
    name: tradepulse-live-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTO_CONNECT
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: tradepulse-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        sync: false
      - key: ANGEL_API_KEY
        sync: false
      - key: ANGEL_CLIENT_CODE
        sync: false
      - key: ANGEL_PIN
        sync: false
      - key: ANGEL_TOTP_SECRET
        sync: false
databases:
  - name: tradepulse-db
    plan: basic-256mb
